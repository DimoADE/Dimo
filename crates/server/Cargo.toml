[package]
name = "server"
version = "0.5.4"
edition = "2024"

[dependencies]
tempfile = { workspace = true }
anyhow = { workspace = true }
application = { path = "../application" }
agents = { path = "../agents" }
api-types = { path = "../api-types" }
artifacts = { path = "../artifacts" }
async-trait = { workspace = true }
automation = { path = "../automation" }
axum = { workspace = true }
base64 = "0.22"
browser-host = { path = "../browser-host" }
chrono = { workspace = true }
conversations = { path = "../conversations" }
db = { path = "../db" }
dirs = { workspace = true }
delegation = { path = "../delegation" }
delegation-proto = { path = "../delegation-proto" }
deployment = { path = "../deployment" }
executors = { path = "../executors" }
futures = { workspace = true }
git = { path = "../git" }
git2 = { workspace = true }
hkdf = "0.12"
ignore = "0.4"
local-deployment = { path = "../local-deployment" }
notify = "8.2.0"
prost = "0.13"
plugins = { path = "../plugins" }
pulse = { path = "../pulse" }
rand = "0.8"
remote-protocol = { path = "../remote-protocol" }
regex = { workspace = true }
reqwest = { workspace = true }
ring = "0.17"
rustls = { workspace = true }
rustls-pki-types = "1"
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
services = { path = "../services" }
sha2 = "0.10"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tar = "0.4"
flate2 = "1.0"
tokio = { workspace = true }
tokio-rustls = "0.26"
tokio-util = { version = "0.7" }
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
trash = "5"
ts-rs = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
utils = { path = "../utils" }
webpki-roots = "0.26"
which = "8.0.0"
workflows = { path = "../workflows" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
futures = { workspace = true }
tower = { version = "0.5", features = ["util"] }
