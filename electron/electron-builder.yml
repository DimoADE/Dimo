appId: com.dimo.app
productName: Dimo
copyright: Copyright © 2026 Dimo
asar: true
compression: normal

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"
  - "!node_modules/**"

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
  - from: resources/bin
    to: bin
  - from: build/icons
    to: icons
    filter:
      - "*.ico"
      - "*.icns"
      - "*.png"
  - from: ../frontend/src/assets
    to: icons
    filter:
      - "app-logo-*.png"
  - from: ../scripts
    to: scripts
    filter:
      - "claude-native-*.mjs"

protocols:
  - name: Dimo
    schemes:
      - dimo

publish:
  provider: github
  owner: DimoADE
  repo: Dimo
  releaseType: release

afterPack: ./build/afterPack.js
afterSign: ./build/afterSign.js

win:
  executableName: Dimo
  icon: build/icons/icon.ico
  artifactName: Dimo-${version}-windows-${arch}-setup.${ext}
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    sign: ./build/signWindows.js
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dimo
  script: build/installer.nsi
  include: build/installer.nsh
  installerLanguages:
    - en_US
    - zh_CN
  installerIcon: build/icons/icon.ico
  uninstallerIcon: build/icons/icon.ico

mac:
  icon: build/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Dimo requires microphone access for voice input and audio features.
    NSCameraUsageDescription: Dimo requires camera access for video calls and media features.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Dimo Previewable Document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.text
          - public.plain-text
          - public.source-code
          - public.yaml
          - public.json
          - public.xml
          - public.html
          - public.image
          - com.adobe.pdf
          - public.mpeg-4
          - org.openxmlformats.wordprocessingml.document
          - org.openxmlformats.spreadsheetml.sheet
          - org.openxmlformats.presentationml.presentation
        CFBundleTypeExtensions:
          - md
          - mdx
          - markdown
          - html
          - htm
          - yaml
          - yml
          - toml
          - json
          - xml
          - ini
          - conf
          - cfg
          - env
          - properties
          - csv
          - log
          - txt
          - lock
          - sql
          - graphql
          - ts
          - tsx
          - js
          - jsx
          - mjs
          - cjs
          - css
          - scss
          - sass
          - less
          - vue
          - svelte
          - rs
          - py
          - go
          - java
          - kt
          - swift
          - dart
          - c
          - h
          - cpp
          - hpp
          - cs
          - rb
          - php
          - lua
          - sh
          - bash
          - zsh
          - ps1
          - png
          - jpg
          - jpeg
          - gif
          - svg
          - webp
          - avif
          - bmp
          - heic
          - heif
          - tif
          - tiff
          - ico
          - pdf
          - mp4
          - docx
          - xlsx
          - pptx
  artifactName: Dimo-${version}-darwin-${arch}.${ext}
  target:
    - dmg
    - zip

dmg:
  background: build/dmg-background.png
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 190
    - x: 480
      y: 190
      type: link
      path: /Applications

linux:
  executableName: dimo
  icon: build/icons/128x128@2x.png
  category: Development
  maintainer: Dimo <support@dimo.dev>
  mimeTypes:
    - text/plain
    - text/markdown
    - text/html
    - text/css
    - text/xml
    - text/csv
    - application/json
    - application/yaml
    - application/x-yaml
    - application/toml
    - application/pdf
    - image/png
    - image/jpeg
    - image/gif
    - image/svg+xml
    - image/webp
    - image/bmp
    - video/mp4
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
  artifactName: Dimo-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb
