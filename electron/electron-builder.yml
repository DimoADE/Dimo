appId: com.dimo.app
productName: Dimo
copyright: Copyright © 2026 Dimo
asar: true
compression: normal

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"
  - "!node_modules/**"

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
  - from: resources/bin
    to: bin
  - from: build/icons
    to: icons
    filter:
      - "*.ico"
      - "*.icns"
      - "*.png"
  - from: ../frontend/src/assets
    to: icons
    filter:
      - "app-logo-*.png"
  - from: ../scripts
    to: scripts
    filter:
      - "claude-native-*.mjs"

protocols:
  - name: Dimo
    schemes:
      - dimo

publish:
  provider: github
  owner: DimoADE
  repo: Dimo
  releaseType: release

afterPack: ./build/afterPack.js
afterSign: ./build/afterSign.js

win:
  executableName: Dimo
  icon: build/icons/icon.ico
  artifactName: Dimo-${version}-windows-${arch}-setup.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dimo
  include: build/installer.nsh
  installerIcon: build/icons/icon.ico
  uninstallerIcon: build/icons/icon.ico

mac:
  icon: build/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: Dimo-${version}-darwin-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  background: build/dmg-background.png
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 190
    - x: 480
      y: 190
      type: link
      path: /Applications

linux:
  icon: build/icons/128x128@2x.png
  category: Development
  maintainer: Dimo <support@dimo.dev>
  artifactName: Dimo-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
